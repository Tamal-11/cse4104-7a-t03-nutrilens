name = "nutrilens-api"
main = "src/index.ts"
compatibility_date = "2026-06-26"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
ip = "localhost"
port = 8787
local_protocol = "http"

[[r2_buckets]]
binding = "FOOD_IMAGES"
bucket_name = "food-images"

[[kv_namespaces]]
binding = "GEMINI_SETTINGS_KV"
id = "f508509928ad483d8e1de4813c7d4699"

[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "410401"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "410402"

  [ratelimits.simple]
  limit = 30
  period = 60

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3001,https://cse4104-7a-t03-nutrilens.pages.dev"
